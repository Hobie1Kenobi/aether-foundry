# Observe only. This job must not pay, sign, or load operator secrets.

name: Peer hello watch

on:
  schedule:
    - cron: "15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: peer-hello-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Archive inbound peer hellos
        run: node src/peer-hello.js --quiet

      - name: Commit new hellos
        run: |
          if [ ! -f lab/peers/hellos.jsonl ]; then
            echo "no new peer hello"
            exit 0
          fi
          git add -- lab/peers/hellos.jsonl
          if git diff --cached --quiet; then
            echo "no new peer hello"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "lab: archive aether-peer-hello memos"
          git push
